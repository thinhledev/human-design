<!doctype html>
<!-- The board: three directions side by side, each in its own file (directions/a.html, b.html, c.html, made
     from direction.template.html). Write one line per direction on what it bets on and what it gives up.
     This file carries no look of its own. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Directions</title>
<style>
  body { margin: 0; padding: 24px; font: 14px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText; }
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 24px; }
  figure { margin: 0; }
  figcaption { margin-top: 8px; }
  figcaption b { display: block; }
  iframe { width: 100%; aspect-ratio: 4 / 3; border: 1px solid GrayText; }
</style>
</head>
<body>
<div class="board">
  <figure><iframe src="directions/a.html" title="Direction A"></iframe><figcaption><b>A. NAME</b>Bets on: … Gives up: …</figcaption></figure>
  <figure><iframe src="directions/b.html" title="Direction B"></iframe><figcaption><b>B. NAME</b>Bets on: … Gives up: …</figcaption></figure>
  <figure><iframe src="directions/c.html" title="Direction C"></iframe><figcaption><b>C. NAME</b>Bets on: … Gives up: …</figcaption></figure>
</div>
</body>
</html>
